; CleverCoffee - Argenta SME, Teensy 4.1 + ESP32-S3 port
;
; Two firmwares live in this repo:
;
;   teensy41  - the control firmware. Owns all real-time control, all physical
;               I/O and all safety. Sources in src/. THIS IS THE ACTIVE WORK.
;
;   esp32_usb - the existing all-ESP32 CleverCoffee firmware, kept as the porting
;               reference and as the base for the ESP32-S3 head. Its entry point
;               moved to src-esp32s3/main.cpp; everything else it needs is still
;               in src/ until the head is split out properly (phase 6).
;
; An esp32s3 env for the Hosyond touch-display head is deliberately NOT defined
; yet - there is no S3-specific code to build, and an env that compiles the old
; ESP32 firmware against S3 pin numbers would only produce misleading failures.
; It arrives in phase 6 with the head itself.
;
; pio is not on PATH here: /home/john/.platformio/penv/bin/pio

[platformio]
lib_dir = lib
src_dir = src
; With two envs and no default, the IDE's Build/Upload/Monitor buttons are
; ambiguous and can act on the wrong firmware. The Teensy is the active work.
default_envs = teensy41
extra_configs = platformio_extra.ini

[env]
framework = arduino
monitor_speed = 115200

build_flags =
  -std=gnu++17

build_unflags =
  -std=gnu++11

; ---------------------------------------------------------------------------
; Teensy 4.1 - control firmware
; ---------------------------------------------------------------------------
[env:teensy41]
platform = teensy
board = teensy41

; Only compile what has actually been ported. This filter is the running ledger
; of the port: each phase adds the files it brings over, so the build never
; silently pulls in ESP32-era code that happens to still be sitting in src/.
build_src_filter =
  -<*>
  +<main.cpp>
  +<safetyHandler.cpp>
  +<bringupConsole.cpp>
  +<hardware/GPIOPin.cpp>
  +<hardware/Relay.cpp>
  +<hardware/outputs.cpp>

build_flags =
  ${env.build_flags}
  -Os

; The watchdog is driven at the chip registers via the Teensy core's imxrt.h, so
; it needs no library. Still to add as phase 2 continues: Adafruit MAX31865
; (RTDs), HX711_ADC (scale), the DuPPa encoder library, and PID.

; ---------------------------------------------------------------------------
; ESP32 - frozen reference firmware / future S3 head
; ---------------------------------------------------------------------------
[env:esp32_usb]
platform = espressif32 @^6.11.0
board = az-delivery-devkit-v4
board_build.filesystem = littlefs
board_build.partitions = partitions_4M.csv

; Everything in src/ except the Teensy-only files, plus the relocated entry point.
; Keep this exclusion list in step with the teensy41 inclusion list above: a file
; written for the Teensy must not drift into this build just because it lives in
; src/.
build_src_filter =
  +<*>
  -<main.cpp>
  -<safetyHandler.cpp>
  -<bringupConsole.cpp>
  -<hardware/outputs.cpp>
  +<../src-esp32s3/main.cpp>

build_flags =
  ${env.build_flags}
  -Os
  -D CONFIG_MAX_FILENAME_LEN=64
  -D CONFIG_MAX_URL_LEN=128
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  -D DEFAULT_MAX_WS_CLIENTS=4
  -D CORE_DEBUG_LEVEL=0
  -D CONFIG_ARDUHAL_LOG_COLORS=0
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D ASYNC_TCP_SSL_ENABLED=0

check_tool = clangtidy
check_skip_packages = yes

lib_deps =
    lebuni/ZACwire for TSic @ 2.0.0
    milesburton/DallasTemperature @ 4.0.4
    paulstoffregen/OneWire @ 2.3.8
    olkal/HX711_ADC @ 1.2.12
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    olikraus/U8g2 @ 2.36.9
    git+https://github.com/rancilio-pid/Arduino-PID-Library#d6d3c69
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.9
    ESP32Async/ESPAsyncWebServer @ 3.9.0
    git+https://github.com/tzapu/WiFiManager @ 2.0.17
    h2zero/NimBLE-Arduino@^2.3.6
    git+https://github.com/rancilio-pid/AcaiaArduinoBLE#v4.0.1
    git+https://github.com/Fattoresaimon/ArduinoDuPPaLib

extra_scripts =
    pre:auto_firmware_version.py
    pre:run_clangformat.py
    pre:auto_compression.py

; 460800 upload fails on this board's CP2102/cable ("Unable to verify flash chip
; connection" right after the baud switch, alongside esptool's unsupported-crystal
; warning). Holding the whole upload at 115200 is reliable here.
upload_speed = 115200
monitor_filters = esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup
