; CleverCoffee - Argenta SME, Teensy 4.1 + ESP32-S3 port
;
; Two firmwares live in this repo:
;
;   teensy41  - the control firmware. Owns all real-time control, all physical
;               I/O and all safety. Sources in src/. THIS IS THE ACTIVE WORK.
;
;   esp32_usb - the existing all-ESP32 CleverCoffee firmware, kept as the porting
;               reference and as the base for the ESP32-S3 head. Its entry point
;               moved to src-esp32s3/main.cpp; everything else it needs is still
;               in src/ until the head is split out properly (phase 6).
;
;   esp32s3   - the ESP32-S3 touch-display HEAD. WiFi, web UI and the colour
;               LCD only; no actuators and no safety. Sources in src-esp32s3/.
;
; The old all-ESP32 firmware now lives in src-esp32-legacy/ to keep it clearly
; apart from the new head.
;
; pio is not on PATH here: /home/john/.platformio/penv/bin/pio

[platformio]
lib_dir = lib
src_dir = src
; With two envs and no default, the IDE's Build/Upload/Monitor buttons are
; ambiguous and can act on the wrong firmware. The Teensy is the active work.
default_envs = teensy41
extra_configs = platformio_extra.ini

[env]
framework = arduino
monitor_speed = 115200

build_flags =
  -std=gnu++17

build_unflags =
  -std=gnu++11

; ---------------------------------------------------------------------------
; Teensy 4.1 - control firmware
; ---------------------------------------------------------------------------
[env:teensy41]
platform = teensy
board = teensy41

; Only compile what has actually been ported. This filter is the running ledger
; of the port: each phase adds the files it brings over, so the build never
; silently pulls in ESP32-era code that happens to still be sitting in src/.
build_src_filter =
  -<*>
  +<main.cpp>
  +<safetyHandler.cpp>
  +<bringupConsole.cpp>
  +<hardware/GPIOPin.cpp>
  +<hardware/Relay.cpp>
  +<hardware/outputs.cpp>
  +<tempHandler.cpp>
  +<flowHandler.cpp>
  +<i2cHandler.cpp>
  +<switchHandler.cpp>
  +<hardware/IOSwitch.cpp>
  +<weightHandler.cpp>
  +<pumpHandler.cpp>
  +<heaterHandler.cpp>
  +<shotHandler.cpp>
  +<configStore.cpp>
  +<hardware/scales/HX711Scale.cpp>
  +<encoderHandler.cpp>
  +<commsHandler.cpp>
  +<updateMode.cpp>
  +<hardware/tempsensors/TempSensorMAX31865.cpp>
  +<utils/Timer.cpp>

build_flags =
  ${env.build_flags}
  -Os

; Upstream's version script: defines AUTO_VERSION from VERSION.txt plus the git
; branch and commit. The controller announces it in its Hello frame, which is
; the only way the display head can know what is running over here - it cannot
; read this chip's flash. Without it the announced version was a hardcoded
; string that went stale the moment the phase it named was finished.
extra_scripts =
    pre:auto_firmware_version.py

lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    olkal/HX711_ADC @ 1.2.12
    git+https://github.com/Fattoresaimon/ArduinoDuPPaLib
    git+https://github.com/rancilio-pid/Arduino-PID-Library#d6d3c69

; Pin the monitor to the Teensy by USB vendor:product rather than letting
; PlatformIO auto-detect. Auto-detect picks the FIRST serial port it finds, and
; on this bench that is a Prolific PL2303 adapter on /dev/ttyUSB0 - so the
; monitor silently attached to the wrong device and showed nothing at all.
; hwgrep matches the Teensy wherever it enumerates, so this survives replugging
; and does not hardcode /dev/ttyACM0.
monitor_port = hwgrep://16C0:0483

; The watchdog is driven at the chip registers via the Teensy core's imxrt.h, so
; it needs no library. Still to add as phase 2 continues: Adafruit MAX31865
; (RTDs), HX711_ADC (scale), the DuPPa encoder library, and PID.

; ---------------------------------------------------------------------------
; Teensy 4.1 - DESK SIMULATION build
;
; Identical to teensy41 except that a thermal model of the boiler is compiled
; in. The heater output drives the model instead of an element, and the
; modelled rise is added to the real PT100 reading, so the PID becomes a loop
; that can actually be tuned at a desk - which is where this project is
; developed. The boiler itself is in the garage with no seals or plumbing.
;
; A SEPARATE BUILD AND NOT A RUNTIME SWITCH, deliberately. The firmware that
; goes into the machine does not contain this code at all - there is no mode
; to leave on by accident, which is the only serious objection to simulating
; an input the safety layer depends on.
;
; DO NOT FLASH THIS INTO THE MACHINE. It bypasses the dry-fire interlock,
; because a model that is never allowed to heat would never do anything.
;
;   pio run -e teensy41_sim -t upload
;
; Back to the real firmware with:
;
;   pio run -e teensy41 -t upload
; ---------------------------------------------------------------------------
[env:teensy41_sim]
extends = env:teensy41

build_src_filter =
  ${env:teensy41.build_src_filter}
  +<boilerSim.cpp>

build_flags =
  ${env:teensy41.build_flags}
  -D DESK_SIM

; ---------------------------------------------------------------------------
; ESP32-S3 head, LVGL TRIAL
; ---------------------------------------------------------------------------
;
; A single page of the UI rebuilt on LVGL, so the choice between LVGL and
; hand-drawn LovyanGFX can be made on measurements instead of on opinion. It
; reproduces Page::Main - the live readout and the boiler chart - because that
; page already exists hand-drawn, which makes this a genuine side by side
; rather than a demo.
;
; A SEPARATE ENV, not a runtime switch, for the same reason teensy41_sim is:
; the shipping firmware must not contain two UI frameworks with a flag choosing
; between them. Nothing here can reach the working head build.
;
; Everything that is NOT the UI is the same code: link.cpp, net.cpp and
; headConfig.cpp are compiled in unchanged, so WiFi, the web server, the
; parameter registry and the Teensy link all run exactly as they do in anger.
; That is the point - the question is not "can LVGL draw a chart", it is "does
; LVGL still behave with this board's real workload underneath it".
;
; Deliberately left out: audio.cpp and es8311.cpp. Sound is a brief DMA feed
; and nothing about it tests LVGL, so it is excluded to keep the trial's
; failure modes few. display.cpp is excluded for the obvious reason; this env
; provides its own lcd instance and its own showMessage().
;
;   pio run -e esp32s3_lvgl -t upload
;
[env:esp32s3_lvgl]
extends = env:esp32s3

build_src_filter =
  -<*>
  +<../src-esp32s3-lvgl/>
  ; The non-UI half of the head, unchanged.
  +<../src-esp32s3/link.cpp>
  +<../src-esp32s3/net.cpp>
  +<../src-esp32s3/headConfig.cpp>
  +<../src/Parameter.cpp>

build_flags =
  ${env:esp32s3.build_flags}
  ; LVGL finds its configuration by plain #include "lv_conf.h", which is why
  ; the trial folder is on the include path.
  -I src-esp32s3-lvgl
  -DLV_CONF_INCLUDE_SIMPLE
  ; The trial reuses the head's own headers - display.h for the board
  ; description, link.h, net.h, headConfig.h - rather than copying them. Those
  ; are found automatically in the esp32s3 env because its sources sit beside
  ; them; from a sibling folder the path has to be given.
  -I src-esp32s3
  -D LVGL_TRIAL

lib_deps =
  ${env:esp32s3.lib_deps}
  ; PINNED EXACTLY, and the pin is the point.
  ;
  ; The UI is edited in SquareLine Studio, which exports generated C calling
  ; LVGL's API directly. So THIS VERSION MUST MATCH THE LVGL VERSION SELECTED
  ; IN THE SQUARELINE PROJECT - that is the rule, not the particular number
  ; below. Change one and you change the other, in the same commit.
  ;
  ; SquareLine 1.6.3 bundles its own runtimes for 8.3.11, 9.1.0, 9.2.2, 9.3,
  ; 9.5 and 9.6 (read from `lvgl/` in its install folder, which is better
  ; evidence than its release notes). 9.6 is the newest it offers and is the
  ; current library release, so that is what both sides use.
  ;
  ; A caret range would be wrong here: a floating minor version would silently
  ; drift away from whatever the editor exported against.
  lvgl/lvgl @ 9.6.0

; ---------------------------------------------------------------------------
; [env:esp32s3_ui] IS GONE, and that is the port finishing rather than
; something breaking.
;
; It existed to build the LVGL head alongside the hand-drawn one while the
; screens were ported page by page, so there was always a way back. Parity was
; reached and John confirmed the panel on hardware on 2026-11-13, so it was
; folded into [env:esp32s3] below - which is what brief 9.15's phasing item 5
; asked for. `display.cpp` is deleted; the frozen copy is in
; `reference/display-lovyangfx/`.
;
; If a note or a script still says `esp32s3_ui`, it predates that merge:
;
;   pio run -e esp32s3 -t upload
;   pio run -e esp32s3 -t uploadfs     (the web UI, still a second upload)
;
; ---------------------------------------------------------------------------
; ESP32 - frozen reference firmware / future S3 head
; ---------------------------------------------------------------------------
[env:esp32_usb]
platform = espressif32 @^6.11.0
board = az-delivery-devkit-v4
board_build.filesystem = littlefs
board_build.partitions = partitions_4M.csv

; Everything in src/ except the Teensy-only files, plus the relocated entry point.
; Keep this exclusion list in step with the teensy41 inclusion list above: a file
; written for the Teensy must not drift into this build just because it lives in
; src/.
build_src_filter =
  +<*>
  -<main.cpp>
  -<safetyHandler.cpp>
  -<bringupConsole.cpp>
  -<hardware/outputs.cpp>
  -<tempHandler.cpp>
  -<flowHandler.cpp>
  -<i2cHandler.cpp>
  -<switchHandler.cpp>
  -<weightHandler.cpp>
  -<pumpHandler.cpp>
  -<heaterHandler.cpp>
  -<shotHandler.cpp>
  -<configStore.cpp>
  -<encoderHandler.cpp>
  -<commsHandler.cpp>
  -<updateMode.cpp>
  +<../src-esp32-legacy/main.cpp>

build_flags =
  ${env.build_flags}
  -Os
  -D CONFIG_MAX_FILENAME_LEN=64
  -D CONFIG_MAX_URL_LEN=128
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  -D DEFAULT_MAX_WS_CLIENTS=4
  -D CORE_DEBUG_LEVEL=0
  -D CONFIG_ARDUHAL_LOG_COLORS=0
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D ASYNC_TCP_SSL_ENABLED=0

check_tool = clangtidy
check_skip_packages = yes

lib_deps =
    lebuni/ZACwire for TSic @ 2.0.0
    milesburton/DallasTemperature @ 4.0.4
    paulstoffregen/OneWire @ 2.3.8
    olkal/HX711_ADC @ 1.2.12
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    olikraus/U8g2 @ 2.36.9
    git+https://github.com/rancilio-pid/Arduino-PID-Library#d6d3c69
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.9
    ESP32Async/ESPAsyncWebServer @ 3.9.0
    git+https://github.com/tzapu/WiFiManager @ 2.0.17
    h2zero/NimBLE-Arduino@^2.3.6
    git+https://github.com/rancilio-pid/AcaiaArduinoBLE#v4.0.1
    git+https://github.com/Fattoresaimon/ArduinoDuPPaLib

extra_scripts =
    pre:auto_firmware_version.py
    pre:run_clangformat.py
    pre:auto_compression.py

; 460800 upload fails on this board's CP2102/cable ("Unable to verify flash chip
; connection" right after the baud switch, alongside esptool's unsupported-crystal
; warning). Holding the whole upload at 115200 is reliable here.
upload_speed = 115200
monitor_filters = esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup

; ---------------------------------------------------------------------------
; ESP32-S3 touch-display head  (LCDwiki / Hosyond 4.0" ESP32-S3 Display)
;
; ST7796S 320x480 IPS over 4-line SPI, FT6336U capacitive touch over I2C,
; ESP32-S3-N16R8 = 16 MB flash + 8 MB OPI PSRAM.
;
; USB-CDC is on for the console, which is what frees UART0 (IO43/IO44) to be
; the link to the Teensy. Without that, boot chatter would be injected straight
; into the Teensy's RX1.
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32 @^6.11.0
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_src_filter =
  -<*>
  +<../src-esp32s3/>
  ; THE LVGL UI IS THE UI, as of 2026-11-13. There is no longer a second head
  ; env: `esp32s3_ui` was folded back in here once the port reached parity and
  ; John confirmed the panel on hardware, which is what brief 9.15's phasing
  ; item 5 asked for.
  ;
  ; `display.cpp` - the hand-drawn LovyanGFX UI - is deleted. It is kept,
  ; frozen and uncompiled, in `reference/display-lovyangfx/`, which is in no
  ; build filter on purpose: half-maintained code is worse than plainly frozen
  ; code. `uiLvgl.cpp` implements the same `display::` namespace, so nothing
  ; else in the head knows the difference.
  ;
  ; Upstream's config machinery, ported to the head unchanged. Config.h,
  ; ConfigDef.h and Parameter are generic - their only hardware dependencies
  ; are Relay.h and Switch.h, which are a forward declaration and a pure
  ; interface respectively, so they carry across as-is.
  ;
  ; ParameterRegistry.cpp is deliberately NOT here: it registers ~100
  ; parameters bound to ESP32-era globals (steamON, machineState, the OLED)
  ; that do not exist on this board. The head gets its own registry listing
  ; what this machine actually has.
  +<../src/Parameter.cpp>

; The startup sound, as raw 16-bit mono PCM at 44.1 kHz, linked straight into
; the firmware image. Embedded rather than put on a filesystem so that one
; upload is still one upload: a separate LittleFS image would be a second
; command that is easy to forget, and the sound would then be silently missing.
;
; Regenerate with:
;   ffmpeg -i startup.mp3 -ac 1 -ar 44100 -af volume=6.3 \
;          -acodec pcm_s16le -f s16le assets/startup_pcm.raw
;
; The gain is there because the original peaks at only -19 dBFS, which is
; inaudible on a 1.5 W speaker. 6.3x brings it to -3 dBFS with no clipping.
board_build.embed_files =
  assets/startup_pcm.raw

build_flags =
  ${env.build_flags}
  -Os
  ; so src-esp32s3 can include the shared config headers from src/
  -I src
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLGFX_USE_V1
  ; LVGL finds its configuration by a plain #include "lv_conf.h", so the folder
  ; holding it has to be on the include path.
  -I src-esp32s3
  -DLV_CONF_INCLUDE_SIMPLE
  ; NO CONFIG_ASYNC_TCP_* FLAGS HERE, deliberately.
  ;
  ; They were copied across from upstream's esp32_usb env and the web server
  ; then refused every connection: port 80 gave TCP RST while the firmware
  ; happily logged "server listening". AsyncTCP creates its service task inside
  ; AsyncServer::begin() and does not report failure, so an undersized stack
  ; looks exactly like a working server that nobody can reach.
  ;
  ; CONFIG_ASYNC_TCP_STACK_SIZE=4096 is half the ESP32Async fork's own default.
  ; Its defaults are sized for this library on this chip; upstream's values were
  ; tuned for a different board and a different era of the library. Leave them
  ; alone unless there is a measured reason not to.

; LittleFS for the web front end. Upstream's frontend/ directory is served from
; a filesystem image rather than embedded, so its files port over unchanged and
; the HTML can be iterated without a firmware rebuild. The cost is that the UI
; is a SECOND upload - see BENCH.md:
;   pio run -e esp32s3 -t uploadfs
board_build.filesystem = littlefs

; Upstream's own script, reused rather than reinvented: it gzips the big
; libraries out of frontend/ into data/, which is the default data_dir, and
; copies the rest. data_dir is a [platformio]-level option and is IGNORED in an
; env section, so pointing it at frontend/ silently did nothing and uploadfs
; failed with "can't read source directory".
;
; auto_firmware_version.py is upstream's too. It defines AUTO_VERSION from
; VERSION.txt plus the git branch and commit, which is what the About page
; shows. Without it the head had no version at all and that card was blank.
extra_scripts =
    pre:auto_compression.py
    pre:auto_firmware_version.py

lib_deps =
    ; Still here with LVGL: LovyanGFX remains the PANEL DRIVER. LVGL draws into
    ; a buffer and LovyanGFX puts it on the glass, which is what `display.h`'s
    ; LGFX class describes.
    lovyan03/LovyanGFX @ ^1.1.16
    ; PINNED EXACTLY, and the pin is the point.
    ;
    ; If a screen is ever drawn in SquareLine Studio, this must equal the LVGL
    ; version selected in the SquareLine project (`ui-design/ArgentaUI.spj`),
    ; and the two change in the same commit. An export is generated C calling
    ; LVGL's API directly, so the editor's idea of that API and the library's
    ; have to agree. A caret range would silently drift away from whatever the
    ; editor exported against. Both sides are on 9.6; see SQUARELINE_UI.md.
    lvgl/lvgl @ 9.6.0
    ; Versions pinned to match upstream's esp32_usb env exactly, so the web
    ; layer behaves the same here as it does on their build.
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.9
    ESP32Async/ESPAsyncWebServer @ 3.9.0
    git+https://github.com/tzapu/WiFiManager @ 2.0.17

; Pin by USB vendor:product rather than letting PlatformIO auto-detect. This
; bench has a Prolific PL2303 adapter that wins auto-detect and is not any of
; our boards; the S3's native USB enumerates as 303a:1001.
monitor_port = hwgrep://303A:1001
upload_port = hwgrep://303A:1001

monitor_filters = esp32_exception_decoder
