; CleverCoffee - Argenta SME, Teensy 4.1 + ESP32-S3 port
;
; Two firmwares live in this repo:
;
;   teensy41  - the control firmware. Owns all real-time control, all physical
;               I/O and all safety. Sources in src/. THIS IS THE ACTIVE WORK.
;
;   esp32_usb - the existing all-ESP32 CleverCoffee firmware, kept as the porting
;               reference and as the base for the ESP32-S3 head. Its entry point
;               moved to src-esp32s3/main.cpp; everything else it needs is still
;               in src/ until the head is split out properly (phase 6).
;
;   esp32s3   - the ESP32-S3 touch-display HEAD. WiFi, web UI and the colour
;               LCD only; no actuators and no safety. Sources in src-esp32s3/.
;
; The old all-ESP32 firmware now lives in src-esp32-legacy/ to keep it clearly
; apart from the new head.
;
; pio is not on PATH here: /home/john/.platformio/penv/bin/pio

[platformio]
lib_dir = lib
src_dir = src
; With two envs and no default, the IDE's Build/Upload/Monitor buttons are
; ambiguous and can act on the wrong firmware. The Teensy is the active work.
default_envs = teensy41
extra_configs = platformio_extra.ini

[env]
framework = arduino
monitor_speed = 115200

build_flags =
  -std=gnu++17

build_unflags =
  -std=gnu++11

; ---------------------------------------------------------------------------
; Teensy 4.1 - control firmware
; ---------------------------------------------------------------------------
[env:teensy41]
platform = teensy
board = teensy41

; Only compile what has actually been ported. This filter is the running ledger
; of the port: each phase adds the files it brings over, so the build never
; silently pulls in ESP32-era code that happens to still be sitting in src/.
build_src_filter =
  -<*>
  +<main.cpp>
  +<safetyHandler.cpp>
  +<bringupConsole.cpp>
  +<hardware/GPIOPin.cpp>
  +<hardware/Relay.cpp>
  +<hardware/outputs.cpp>
  +<tempHandler.cpp>
  +<flowHandler.cpp>
  +<i2cHandler.cpp>
  +<switchHandler.cpp>
  +<hardware/IOSwitch.cpp>
  +<weightHandler.cpp>
  +<pumpHandler.cpp>
  +<heaterHandler.cpp>
  +<shotHandler.cpp>
  +<configStore.cpp>
  +<hardware/scales/HX711Scale.cpp>
  +<encoderHandler.cpp>
  +<commsHandler.cpp>
  +<updateMode.cpp>
  +<hardware/tempsensors/TempSensorMAX31865.cpp>
  +<utils/Timer.cpp>

build_flags =
  ${env.build_flags}
  -Os

lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    olkal/HX711_ADC @ 1.2.12
    git+https://github.com/Fattoresaimon/ArduinoDuPPaLib
    git+https://github.com/rancilio-pid/Arduino-PID-Library#d6d3c69

; Pin the monitor to the Teensy by USB vendor:product rather than letting
; PlatformIO auto-detect. Auto-detect picks the FIRST serial port it finds, and
; on this bench that is a Prolific PL2303 adapter on /dev/ttyUSB0 - so the
; monitor silently attached to the wrong device and showed nothing at all.
; hwgrep matches the Teensy wherever it enumerates, so this survives replugging
; and does not hardcode /dev/ttyACM0.
monitor_port = hwgrep://16C0:0483

; The watchdog is driven at the chip registers via the Teensy core's imxrt.h, so
; it needs no library. Still to add as phase 2 continues: Adafruit MAX31865
; (RTDs), HX711_ADC (scale), the DuPPa encoder library, and PID.

; ---------------------------------------------------------------------------
; ESP32 - frozen reference firmware / future S3 head
; ---------------------------------------------------------------------------
[env:esp32_usb]
platform = espressif32 @^6.11.0
board = az-delivery-devkit-v4
board_build.filesystem = littlefs
board_build.partitions = partitions_4M.csv

; Everything in src/ except the Teensy-only files, plus the relocated entry point.
; Keep this exclusion list in step with the teensy41 inclusion list above: a file
; written for the Teensy must not drift into this build just because it lives in
; src/.
build_src_filter =
  +<*>
  -<main.cpp>
  -<safetyHandler.cpp>
  -<bringupConsole.cpp>
  -<hardware/outputs.cpp>
  -<tempHandler.cpp>
  -<flowHandler.cpp>
  -<i2cHandler.cpp>
  -<switchHandler.cpp>
  -<weightHandler.cpp>
  -<pumpHandler.cpp>
  -<heaterHandler.cpp>
  -<shotHandler.cpp>
  -<configStore.cpp>
  -<encoderHandler.cpp>
  -<commsHandler.cpp>
  -<updateMode.cpp>
  +<../src-esp32-legacy/main.cpp>

build_flags =
  ${env.build_flags}
  -Os
  -D CONFIG_MAX_FILENAME_LEN=64
  -D CONFIG_MAX_URL_LEN=128
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  -D DEFAULT_MAX_WS_CLIENTS=4
  -D CORE_DEBUG_LEVEL=0
  -D CONFIG_ARDUHAL_LOG_COLORS=0
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D ASYNC_TCP_SSL_ENABLED=0

check_tool = clangtidy
check_skip_packages = yes

lib_deps =
    lebuni/ZACwire for TSic @ 2.0.0
    milesburton/DallasTemperature @ 4.0.4
    paulstoffregen/OneWire @ 2.3.8
    olkal/HX711_ADC @ 1.2.12
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    olikraus/U8g2 @ 2.36.9
    git+https://github.com/rancilio-pid/Arduino-PID-Library#d6d3c69
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.9
    ESP32Async/ESPAsyncWebServer @ 3.9.0
    git+https://github.com/tzapu/WiFiManager @ 2.0.17
    h2zero/NimBLE-Arduino@^2.3.6
    git+https://github.com/rancilio-pid/AcaiaArduinoBLE#v4.0.1
    git+https://github.com/Fattoresaimon/ArduinoDuPPaLib

extra_scripts =
    pre:auto_firmware_version.py
    pre:run_clangformat.py
    pre:auto_compression.py

; 460800 upload fails on this board's CP2102/cable ("Unable to verify flash chip
; connection" right after the baud switch, alongside esptool's unsupported-crystal
; warning). Holding the whole upload at 115200 is reliable here.
upload_speed = 115200
monitor_filters = esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup

; ---------------------------------------------------------------------------
; ESP32-S3 touch-display head  (LCDwiki / Hosyond 4.0" ESP32-S3 Display)
;
; ST7796S 320x480 IPS over 4-line SPI, FT6336U capacitive touch over I2C,
; ESP32-S3-N16R8 = 16 MB flash + 8 MB OPI PSRAM.
;
; USB-CDC is on for the console, which is what frees UART0 (IO43/IO44) to be
; the link to the Teensy. Without that, boot chatter would be injected straight
; into the Teensy's RX1.
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32 @^6.11.0
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_src_filter =
  -<*>
  +<../src-esp32s3/>

; The startup sound, as raw 16-bit mono PCM at 44.1 kHz, linked straight into
; the firmware image. Embedded rather than put on a filesystem so that one
; upload is still one upload: a separate LittleFS image would be a second
; command that is easy to forget, and the sound would then be silently missing.
;
; Regenerate with:
;   ffmpeg -i startup.mp3 -ac 1 -ar 44100 -af volume=6.3 \
;          -acodec pcm_s16le -f s16le assets/startup_pcm.raw
;
; The gain is there because the original peaks at only -19 dBFS, which is
; inaudible on a 1.5 W speaker. 6.3x brings it to -3 dBFS with no clipping.
board_build.embed_files =
  assets/startup_pcm.raw

build_flags =
  ${env.build_flags}
  -Os
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLGFX_USE_V1
  ; NO CONFIG_ASYNC_TCP_* FLAGS HERE, deliberately.
  ;
  ; They were copied across from upstream's esp32_usb env and the web server
  ; then refused every connection: port 80 gave TCP RST while the firmware
  ; happily logged "server listening". AsyncTCP creates its service task inside
  ; AsyncServer::begin() and does not report failure, so an undersized stack
  ; looks exactly like a working server that nobody can reach.
  ;
  ; CONFIG_ASYNC_TCP_STACK_SIZE=4096 is half the ESP32Async fork's own default.
  ; Its defaults are sized for this library on this chip; upstream's values were
  ; tuned for a different board and a different era of the library. Leave them
  ; alone unless there is a measured reason not to.

; LittleFS for the web front end. Upstream's frontend/ directory is served from
; a filesystem image rather than embedded, so its files port over unchanged and
; the HTML can be iterated without a firmware rebuild. The cost is that the UI
; is a SECOND upload - see BENCH.md:
;   pio run -e esp32s3 -t uploadfs
board_build.filesystem = littlefs

; Upstream's own script, reused rather than reinvented: it gzips the big
; libraries out of frontend/ into data/, which is the default data_dir, and
; copies the rest. data_dir is a [platformio]-level option and is IGNORED in an
; env section, so pointing it at frontend/ silently did nothing and uploadfs
; failed with "can't read source directory".
extra_scripts =
    pre:auto_compression.py

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    ; Versions pinned to match upstream's esp32_usb env exactly, so the web
    ; layer behaves the same here as it does on their build.
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.9
    ESP32Async/ESPAsyncWebServer @ 3.9.0
    git+https://github.com/tzapu/WiFiManager @ 2.0.17

; Pin by USB vendor:product rather than letting PlatformIO auto-detect. This
; bench has a Prolific PL2303 adapter that wins auto-detect and is not any of
; our boards; the S3's native USB enumerates as 303a:1001.
monitor_port = hwgrep://303A:1001
upload_port = hwgrep://303A:1001

monitor_filters = esp32_exception_decoder
