<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clever Coffee PID</title>
    <link rel="icon" href="data:image/svg+xml,%%3Csvg%%20xmlns='http://www.w3.org/2000/svg'%%20viewBox='0%%200%%2016%%2016'%%3E%%3Ctext%%20x='0'%%20y='14'%%3E☕%%3C/text%%3E%%3C/svg%%3E" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />

    <!-- Set the saved theme before anything paints, so there's no light-mode flash on load -->
    <script>
        (function() {
            try {
                if (localStorage.getItem('cc-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/dark-mode.css">

    <script src="/js/load-libs.js" defer></script>

    <script>
        //delay loading app js until html has been loaded (to reduce concurrent requests)
        document.addEventListener("DOMContentLoaded", function(event) {
            const fb = document.getElementById("fallback-warning");
            if (fb) fb.style.display = "none";
        })
    </script>
</head>

<body>
<noscript>
  <div style="padding:1em; background:#6c757d; color:#ffffff; font-weight:bold;">
    JavaScript is disabled — please enable it to use this interface.
  </div>
</noscript>

<div id="fallback-warning" style="padding:1em; background:#6c757d; color:#ffffff; font-weight:bold;">
  If you are seeing plain text or an unstyled page, the resources may not have loaded.<br>
  Please try refreshing the page. If that doesn’t help, reboot the device.
</div>

<div id="page-container">
    <div id="navigation">
        <nav class="navbar navbar-expand-xl navbar-dark bg-secondary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <img alt="Clever Coffee"
                        src="/img/logo.png"
                        style="width:64px;">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent"
                    aria-expanded="false" aria-label="Toggle page navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarToggleExternalContent">
                    <div class="navbar-nav">
                        <a class="nav-item nav-link" href="/"><i class="fa-solid fa-house"></i> Home</a>
                        <a class="nav-item nav-link" href="/parameters.html?tab=settings"><i class="fa-solid fa-sliders"></i> Settings</a>
                        <a class="nav-item nav-link" href="/parameters.html?tab=hardware"><i class="fa-solid fa-microchip"></i> Hardware</a>
                        <a class="nav-item nav-link" href="/parameters.html?tab=system"><i class="fa-solid fa-gear"></i> System</a>
                        <a class="nav-item nav-link" href="/parameters.html?tab=about"><i class="fa-solid fa-circle-info"></i> About</a>
                    </div>
                </div>
                <button type="button" id="theme-toggle" class="btn btn-sm btn-outline-light ms-2" aria-label="Toggle dark mode">
                    <span class="fa-solid fa-moon"></span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Highlight the nav item for the page/tab currently shown -->
    <script>
        (function() {
            var path = window.location.pathname;
            var params = new URLSearchParams(window.location.search);
            var onParams = path === '/parameters.html' || path === '/parameters';
            var onHome = path === '/' || path === '/index.html';

            // Match the Settings page's own tab resolution (incl. the legacy ?filter= scheme)
            var tab = params.get('tab');
            if (!tab && params.get('filter') === 'hardware') tab = 'hardware';
            if (!tab && params.get('filter') === 'behavior') tab = 'settings';
            if (onParams && !tab) tab = 'settings';

            document.querySelectorAll('#navigation .navbar-nav .nav-link').forEach(function(a) {
                var href = a.getAttribute('href') || '';
                if (href === '/' && onHome) {
                    a.classList.add('active');
                }
                else if (href.indexOf('/parameters.html') === 0 && onParams) {
                    var linkTab = new URLSearchParams((href.split('?')[1] || '')).get('tab');
                    if (linkTab === tab) a.classList.add('active');
                }
            });
        })();
    </script>

    <script>
        (function() {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var icon = btn.querySelector('span');

            function updateIcon() {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                icon.classList.toggle('fa-moon', !isDark);
                icon.classList.toggle('fa-sun', isDark);
            }

            updateIcon();

            btn.addEventListener('click', function() {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';

                try {
                    if (isDark) {
                        document.documentElement.removeAttribute('data-theme');
                        localStorage.setItem('cc-theme', 'light');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('cc-theme', 'dark');
                    }
                } catch (e) {}

                // Chart colors (temp.js) and a couple of other things are only set up at
                // load time, so reload rather than try to live-recolor everything.
                window.location.reload();
            });
        })();
    </script>
